<meta charset="utf-8">
<div id="hlm-app" data-weather="晴">
  <div class="hlm-bg" id="hlm-bg">
    <i class="hlm-cloud c1"></i><i class="hlm-cloud c2"></i><i class="hlm-cloud c3"></i>
    <i class="hlm-sun"></i>
  </div>
  <div class="hlm-fx" id="hlm-fx"></div>

  <div class="hlm-topinfo">
    <span class="hlm-world"><i id="hlm-date">—</i><em></em><i id="hlm-time">—</i><em></em><i id="hlm-weather">—</i><em></em><i id="hlm-loc">—</i></span>
    <span class="hlm-favor">
      <span class="xm">林小满 <b id="hlm-xm-num">50</b></span>
      <span class="hlm-minibar"><span class="hlm-minibar-xm" id="hlm-bar-xm"></span></span>
      <span class="sz"><b id="hlm-sz-num">50</b> 宋昭</span>
    </span>
  </div>

  <div class="hlm-stage">
    <div class="hlm-sprite xm" id="hlm-sprite-xm"><div class="hlm-stand"><span>林小满</span></div></div>
    <div class="hlm-sprite sz" id="hlm-sprite-sz"><div class="hlm-stand"><span>宋昭</span></div></div>
    <div class="hlm-sprite npc" id="hlm-sprite-npc"></div>
    <div class="hlm-gone-tag" id="hlm-gone-tag" style="display:none"></div>
  </div>

  <div class="hlm-quicknav">
    <button class="hlm-qitem" id="hlm-btn-back"><span class="hlm-qico">↶</span><span class="hlm-qlabel">BACK</span></button>
    <button class="hlm-qitem" id="hlm-btn-auto"><span class="hlm-qico">▶</span><span class="hlm-qlabel">AUTO</span></button>
    <button class="hlm-qitem" id="hlm-btn-log"><span class="hlm-qico">▤</span><span class="hlm-qlabel">LOG</span></button>
    <button class="hlm-qitem" id="hlm-btn-hide"><span class="hlm-qico">◻</span><span class="hlm-qlabel">HIDE</span></button>
    <button class="hlm-qitem" id="hlm-btn-status"><span class="hlm-qico">☰</span><span class="hlm-qlabel">DATA<br>STATUS</span></button>
    <button class="hlm-qitem" id="hlm-btn-diary"><span class="hlm-qico">❒</span><span class="hlm-qlabel">SECRET<br>DIARY</span></button>
    <button class="hlm-qitem" id="hlm-btn-fs"><span class="hlm-qico">⛶</span><span class="hlm-qlabel">FULL<br>SCREEN</span></button>
  </div>

  <div class="hlm-band">
    <div class="hlm-speaker"><span id="hlm-speaker">幻想肥皂泡</span></div>
    <main class="hlm-story" id="hlm-story"></main>
    <i class="hlm-next" id="hlm-next" style="display:none">▼</i>
    <i class="hlm-band-flower">❀</i>
  </div>

  <div class="hlm-modal" id="hlm-modal-status">
    <div class="hlm-sheet">
      <div class="hlm-sheet-head"><span class="hlm-s-cn">状态</span><span class="hlm-s-en">DATA STATUS</span><button class="hlm-x" data-close="hlm-modal-status">✕</button></div>
      <div class="hlm-kv"><span>日期 DATE</span><b id="hlm-s-date">—</b></div>
      <div class="hlm-kv"><span>时间 TIME</span><b id="hlm-s-time">—</b></div>
      <div class="hlm-kv"><span>天气 WEATHER</span><b id="hlm-s-weather">—</b></div>
      <div class="hlm-kv"><span>地点 LOCATION</span><b id="hlm-s-loc">—</b></div>
      <div class="hlm-kv"><span class="xm">林小满 · 好感 SYNC</span><b class="xm" id="hlm-s-xm">50</b></div>
      <div class="hlm-kv"><span class="sz">宋昭 · 好感 SYNC</span><b class="sz" id="hlm-s-sz">50</b></div>
      <div class="hlm-kv"><span>上次变化 LAST</span><b id="hlm-s-last">—</b></div>
      <div class="hlm-kv"><span>今日变化次数 CHANGES</span><b id="hlm-s-cnt">0</b></div>
      <div class="hlm-kv"><span class="xm">林小满 STATE</span><b class="xm" id="hlm-s-xm-state">在场</b></div>
      <div class="hlm-kv"><span class="sz">宋昭 STATE</span><b class="sz" id="hlm-s-sz-state">在场</b></div>
      <div class="hlm-note">两个人格的好感之和，恒为 100。</div>
    </div>
  </div>

  <div class="hlm-modal" id="hlm-modal-diary">
    <div class="hlm-sheet hlm-diary-sheet">
      <div class="hlm-sheet-head">
        <span class="hlm-tab xm" data-tab="林小满日记" data-who="林小满">林小满的日记</span>
        <span class="hlm-vline"></span>
        <span class="hlm-tab sz" data-tab="宋昭日记" data-who="宋昭">宋昭的日记</span>
        <button class="hlm-x" data-close="hlm-modal-diary">✕</button>
      </div>
      <div class="hlm-diary-list" id="hlm-diary-list"></div>
    </div>
  </div>
  <div class="hlm-modal" id="hlm-modal-log">
    <div class="hlm-sheet">
      <div class="hlm-sheet-head"><span class="hlm-s-cn">对话记录</span><span class="hlm-s-en">BACKLOG</span><button class="hlm-x" data-close="hlm-modal-log">✕</button></div>
      <div class="hlm-diary-list" id="hlm-log-list"></div>
    </div>
  </div>
</div>

<style>
@import url('https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-400.css');
@import url('https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css');
#hlm-app{position:relative;height:86vh;min-height:560px;border-radius:14px;overflow:hidden;
  font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#3b414b;background:#9ec7e8;
  display:flex;flex-direction:column;--xm:#e2647e;--sz:#5a8fc0;--rose:#d95f7f;
  box-shadow:0 10px 40px rgba(30,50,70,.35)}
#hlm-app.fs{height:100vh;border-radius:0}
#hlm-app *,#hlm-app *::before,#hlm-app *::after{box-sizing:border-box}

/* ── 背景:通栏无遮挡 ── */
.hlm-bg{position:absolute;inset:0;background-size:cover;background-position:center;
  background-image:linear-gradient(180deg,#6fb0e3 0%,#9cc9ea 42%,#cfe6f2 68%,#f3efe6 100%)}
.hlm-bg.hasimg .hlm-cloud,.hlm-bg.hasimg .hlm-sun{display:none}
.hlm-cloud{position:absolute;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0));
  border-radius:50%;filter:blur(2px)}
.hlm-cloud.c1{left:6%;top:10%;width:34%;height:16%}
.hlm-cloud.c2{left:52%;top:22%;width:28%;height:12%;opacity:.85}
.hlm-cloud.c3{left:26%;top:34%;width:22%;height:9%;opacity:.7}
.hlm-sun{position:absolute;right:14%;top:6%;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,252,235,.9),rgba(255,250,220,0) 70%)}
.hlm-fx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.hlm-fx .star{position:absolute;font-size:11px;color:rgba(255,255,255,.9);animation:twk 4s ease-in-out infinite;font-style:normal}
.hlm-fx .mote{position:absolute;bottom:-14px;font-size:11px;opacity:0;animation:rise 12s linear infinite;font-style:normal}
#hlm-app[data-weather="雨"] .hlm-fx .rain{position:absolute;inset:0;
  background:repeating-linear-gradient(100deg,transparent 0 15px,rgba(120,150,200,.13) 15px 16px);
  background-size:220px 260px;animation:rainfall 1s linear infinite}
#hlm-app[data-weather="雨"] .hlm-bg{filter:saturate(.7) brightness(.75)}
#hlm-app[data-weather="阴"] .hlm-bg{filter:saturate(.6) brightness(.88)}
@keyframes twk{0%,100%{opacity:.1;transform:scale(.8)}50%{opacity:.9;transform:scale(1.25)}}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.55}80%{opacity:.2}100%{transform:translateY(-90vh) translateX(3vw);opacity:0}}
@keyframes rainfall{to{background-position:-90px 260px}}

/* ── 顶部一行极简信息 ── */
.hlm-topinfo{position:absolute;z-index:6;top:12px;left:18px;right:18px;display:flex;justify-content:space-between;
  align-items:center;font-size:12px;letter-spacing:1.5px;color:rgba(55,80,105,.85);
  text-shadow:0 0 6px rgba(255,255,255,.95),0 0 14px rgba(255,255,255,.8);font-variant-numeric:tabular-nums}
.hlm-world{display:flex;align-items:center;gap:8px}
.hlm-world em{width:3px;height:3px;border-radius:50%;background:rgba(217,95,127,.55)}
.hlm-favor{display:flex;align-items:center;gap:9px}
.hlm-favor .xm{color:var(--xm)}.hlm-favor .sz{color:var(--sz)}
.hlm-favor b{font-size:14px;font-weight:700}
.hlm-minibar{position:relative;width:58px;height:3px;border-radius:2px;background:var(--sz);overflow:hidden;opacity:.75}
.hlm-minibar-xm{position:absolute;left:0;top:0;height:100%;width:50%;background:var(--xm);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.pulse{animation:pls .9s ease}
@keyframes pls{0%,100%{opacity:1}40%{opacity:.3}}

/* ── 立绘:底边锚定在界面最底端(藏在文字横带后),放大只会向上生长,不会露出底边 ── */
.hlm-stage{position:absolute;inset:0;z-index:2;pointer-events:none}
.hlm-sprite{position:absolute;bottom:0;height:100%;width:48%;max-width:640px;transform:translateX(-50%);opacity:0;
  transition:left 1.1s cubic-bezier(.3,.8,.3,1),opacity 1s,filter 1s;
  background-size:contain;background-repeat:no-repeat;background-position:bottom center}
.hlm-sprite.xm{left:46%}.hlm-sprite.sz{left:58%}
.hlm-sprite.npc{left:6%;opacity:0}
.hlm-stand{position:absolute;left:50%;bottom:30%;transform:translateX(-50%);writing-mode:vertical-rl;
  font-family:'Noto Serif SC','SimSun',serif;font-size:19px;letter-spacing:14px;color:rgba(60,85,110,.5);
  border-left:1px solid rgba(60,85,110,.25);padding-left:12px;text-shadow:0 0 8px rgba(255,255,255,.8)}
.hlm-sprite:not(.noimg) .hlm-stand{display:none}
.hlm-sprite.gone{opacity:.04;filter:grayscale(1) blur(4px)}
.hlm-gone-tag{position:absolute;top:14px;left:50%;transform:translateX(-50%);
  font-family:'Noto Serif SC','SimSun',serif;font-size:14px;letter-spacing:4px;color:var(--rose);
  text-shadow:0 0 10px rgba(255,255,255,.95)}

/* ── 快捷菜单:小图标+英文小字,靠右放大,无边框底色 ── */
.hlm-quicknav{position:relative;z-index:6;margin-top:auto;display:flex;justify-content:flex-end;gap:26px;padding:10px 24px 10px 0}
.hlm-qitem{display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;padding:4px 6px;
  color:rgba(75,100,125,.78);font-family:inherit;transition:color .15s;
  text-shadow:0 0 6px rgba(255,255,255,.95),0 0 14px rgba(255,255,255,.75)}
.hlm-qitem:hover{color:var(--rose)}
.hlm-qitem.on{color:var(--rose)}
/* 隐藏界面:只剩背景与立绘,点击任意处恢复 */
#hlm-app.hideui .hlm-band,#hlm-app.hideui .hlm-topinfo,#hlm-app.hideui .hlm-quicknav{display:none}
.hlm-qico{font-size:18px;line-height:1;font-style:normal}
.hlm-qlabel{font-size:9px;letter-spacing:1.8px;text-align:left;line-height:1.5;text-transform:uppercase;font-weight:600}

/* ── 正文:通栏白色横带 ── */
.hlm-band{position:relative;z-index:5;background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.95));
  backdrop-filter:blur(6px);border-top:1px solid rgba(255,255,255,.75);padding:2px 7% 20px;min-height:200px}
.hlm-band-flower{position:absolute;right:4%;bottom:6px;font-size:44px;font-style:normal;color:var(--rose);opacity:.12;pointer-events:none}
.hlm-speaker{display:flex;align-items:center;gap:12px;margin:10px 0 4px 2%}
.hlm-speaker::before{content:'';width:52px;height:1px;background:var(--rose);opacity:.8}
.hlm-speaker span{font-family:'Noto Serif SC','SimSun',serif;font-size:16px;letter-spacing:5px;color:var(--rose);font-weight:700}
.hlm-story{max-height:230px;overflow-y:auto;font-family:'Noto Serif SC','Source Han Serif SC','SimSun',serif;
  font-size:16.5px;line-height:2.05;letter-spacing:.5px;color:#3b414b;scrollbar-width:thin}
#hlm-app ::-webkit-scrollbar{width:4px}
#hlm-app ::-webkit-scrollbar-thumb{background:rgba(90,120,150,.3);border-radius:2px}
.hlm-story p{margin:0;text-indent:2em}
.hlm-story p + p{margin-top:.6em}
.hlm-story b{color:var(--rose);font-weight:700}
/* 对话行:台词顶格,说话人显示在左上角名牌 */
.hlm-story .hlm-dlg{margin:0;text-indent:0}
#hlm-speaker.xm{color:var(--xm)}
#hlm-speaker.sz{color:var(--sz)}
#hlm-speaker.u{color:var(--rose)}
#hlm-speaker.n{color:rgba(59,65,75,.5)}
/* 待续箭头 & 立绘弹出动画 */
.hlm-next{position:absolute;right:16px;bottom:8px;font-style:normal;font-size:12px;color:var(--rose);
  cursor:pointer;z-index:2;animation:hlm-blink 1.1s ease-in-out infinite}
@keyframes hlm-blink{0%,100%{transform:translateY(0);opacity:.3}50%{transform:translateY(3px);opacity:1}}
.hlm-sprite.pop{animation:hlm-pop .5s cubic-bezier(.25,.9,.3,1.25)}
@keyframes hlm-pop{0%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.055)}100%{transform:translateX(-50%) scale(1)}}

/* ── 弹窗:白纸极简 ── */
.hlm-modal{position:absolute;inset:0;z-index:10;background:rgba(255,255,255,.28);backdrop-filter:blur(4px);
  display:none;align-items:flex-end}
.hlm-modal.open{display:flex}
.hlm-sheet{width:100%;max-height:72%;overflow-y:auto;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);
  border-top:1px solid rgba(217,95,127,.35);padding:18px 8% 22px;scrollbar-width:thin}
.hlm-sheet-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;border-bottom:1px solid rgba(59,65,75,.12);padding-bottom:10px}
.hlm-s-cn{font-family:'Noto Serif SC','SimSun',serif;font-size:17px;letter-spacing:6px;color:var(--rose);font-weight:700}
.hlm-s-en{font-size:9px;letter-spacing:3px;color:rgba(59,65,75,.45)}
.hlm-x{margin-left:auto;background:none;border:none;font-size:14px;color:rgba(59,65,75,.6);cursor:pointer;padding:4px 8px}
.hlm-x:hover{color:var(--rose)}
.hlm-kv{display:flex;justify-content:space-between;align-items:baseline;padding:9px 2px;border-bottom:1px solid rgba(59,65,75,.08);font-size:13px}
.hlm-kv span{color:rgba(59,65,75,.55);letter-spacing:1px;font-size:11.5px}
.hlm-kv b{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.hlm-kv .xm, .hlm-kv b.xm{color:var(--xm)}
.hlm-kv .sz, .hlm-kv b.sz{color:var(--sz)}
.hlm-note{text-align:center;color:rgba(59,65,75,.4);font-size:11px;padding-top:14px;letter-spacing:2px}
/* 日记 */
.hlm-tab{cursor:pointer;font-family:'Noto Serif SC','SimSun',serif;font-size:15px;letter-spacing:3px;
  color:rgba(59,65,75,.35);transition:color .2s;font-weight:700}
.hlm-tab.active{color:var(--rose)}
.hlm-tab.locked{opacity:.5}
.hlm-vline{width:1px;height:14px;background:rgba(59,65,75,.2);align-self:center}
.hlm-diary-list{display:flex;flex-direction:column;gap:14px}
.hlm-diary-item{padding:12px 4px 14px;border-bottom:1px solid rgba(59,65,75,.08)}
.hlm-diary-item .d-date{font-family:'Noto Serif SC','SimSun',serif;font-size:11.5px;letter-spacing:2px;
  color:var(--rose);margin-bottom:6px;font-variant-numeric:tabular-nums}
.hlm-diary-item .d-date::before{content:'— ';opacity:.6}
.hlm-diary-item .d-body{font-family:'Noto Serif SC','SimSun',serif;font-size:14px;line-height:2;color:#3b414b}
.hlm-diary-lock{padding:34px 20px;text-align:center;color:rgba(59,65,75,.55);font-size:13px;letter-spacing:2px;line-height:2.2;
  font-family:'Noto Serif SC','SimSun',serif;border:1px dashed rgba(217,95,127,.35);border-radius:2px}
.hlm-diary-lock .lk{font-size:19px;display:block;margin-bottom:8px;filter:grayscale(.4)}
.hlm-empty{padding:34px 0;text-align:center;color:rgba(59,65,75,.35);font-size:13px;letter-spacing:2px}
/* 对话记录 backlog */
.hlm-log-item{display:flex;gap:12px;padding:9px 6px;border-bottom:1px solid rgba(59,65,75,.08);font-size:13.5px;line-height:1.95}
.hlm-log-item .l-name{flex:0 0 auto;min-width:56px;font-weight:700;font-family:'Noto Serif SC','SimSun',serif;letter-spacing:2px}
.hlm-log-item .l-name.xm{color:var(--xm)}
.hlm-log-item .l-name.sz{color:var(--sz)}
.hlm-log-item .l-name.u{color:var(--rose)}
.hlm-log-item .l-name.n{color:rgba(59,65,75,.45)}
.hlm-log-item .l-text{flex:1;color:#3b414b}
.hlm-log-cur{background:rgba(217,95,127,.07);border-radius:4px}

/* ── 手机横屏适配:小屏时铺满视口、压缩字号间距 ── */
@media (max-height:600px){
  #hlm-app{height:100vh;min-height:0;border-radius:0;box-shadow:none}
  .hlm-topinfo{top:6px;left:10px;right:10px;font-size:10px;letter-spacing:.5px;gap:6px}
  .hlm-favor{gap:5px}
  .hlm-favor b{font-size:12px}
  .hlm-minibar{width:40px}
  .hlm-quicknav{gap:14px;padding:5px 12px 5px 0}
  .hlm-qico{font-size:15px}
  .hlm-qlabel{font-size:8px}
  .hlm-band{min-height:150px;padding:0 4% 12px}
  .hlm-speaker{margin:6px 0 2px 1%;gap:8px}
  .hlm-speaker span{font-size:14px;letter-spacing:3px}
  .hlm-speaker::before{width:34px}
  .hlm-story{max-height:120px;font-size:13.5px;line-height:1.8}
  .hlm-next{right:10px;bottom:4px}
  .hlm-band-flower{font-size:30px}
  .hlm-sheet{padding:12px 5% 16px}
  .hlm-kv{padding:6px 2px;font-size:12px}
}
</style>

<script type="text/plain" id="hlm-story-raw"></script>

<script>
(function(){

    '宋昭':   { 普通:BASE+'Character Standee/Songshao/ss_default.png', 开心:BASE+'Character Standee/Songshao/ss_happy.png', 生气:BASE+'Character Standee/Songshao/ss_angry.png', 难过:BASE+'Character Standee/Songshao/ss_sad.png', 害羞:BASE+'Character Standee/Songshao/ss_shy.png', 惊讶:BASE+'Character Standee/Songshao/ss_shock.png' }

function npcArchetype(name, bracket){

  const GENDER_HINT = /少女|女孩|女生|小姐|妹子|阿姨|大妈|妈|奶|婆|姐|嫂|女|祖母|外婆/;
  const b = (bracket || '').replace(/性/g, '');
  const gender = /男/.test(b) ? '男' : /女/.test(b) ? '女' : '';
  const age = /青年|年轻/.test(b) ? '年轻' : /中年/.test(b) ? '中年' : /老年/.test(b) ? '老年' : '';
  const s = (name || '') + ' ' + (bracket || '');
  for (const [k, re] of NPC_PAT){
    if (gender && age) break;                                  /* 括号齐全,称呼表不再参与 */
    if (re.test(s) && (!gender || k[0] === gender) && (!age || k.slice(1) === age)) return k;
  }
  if (gender && age) return gender + age;
  if (gender){
    const ageFromName = NPC_PAT.find(([k, re]) => re.test(s));  /* 缺年龄:称呼里的年龄段可借,性别以括号为准 */
    return gender + (age || (ageFromName ? ageFromName[0].slice(1) : '中年'));
  }
  if (age) return (GENDER_HINT.test(s) ? '女' : '男') + age;
  for (const [k, re] of NPC_PAT) if (re.test(s)) return k;
  return '男中年';                                              /* 完全无线索时的兜底形象 */

function resolveScene(path){
  const segs = String(path || '').split('/').map(s => s.trim()).filter(Boolean);
  const ks = Object.keys(ASSETS.场景别名).sort((a, b) => b.length - a.length);
  let kwHit = '';
  for (let i = segs.length - 1; i >= 0; i--){
    const s = segs[i], combo = (i > 0 ? segs[i-1] : '') + s;
    if (ASSETS.背景[s]) return s;
    if (ASSETS.背景[combo]) return combo;
    const a = ks.find(k => s.includes(k)) || ks.find(k => combo.includes(k));
    if (a && ASSETS.背景[ASSETS.场景别名[a]]) return ASSETS.场景别名[a];
    if (!kwHit){
      for (const [p, c] of ASSETS.场景关键词){
        if (new RegExp(p).test(s) && ASSETS.背景[c]){ kwHit = c; break; }
      }
    }
  }
  return ASSETS.背景[kwHit] ? kwHit : '默认';
}

  $('#hlm-s-last').textContent = f.上次变化日期 || '—';
  $('#hlm-s-cnt').textContent = (f.当天变化情况 && f.当天变化情况.已变化次数) || 0;
  const g1 = !!st.林小满是否消失, g2 = !!st.宋昭是否消失;
  $('#hlm-sprite-xm').classList.toggle('gone', g1);
  $('#hlm-sprite-sz').classList.toggle('gone', g2);
  layoutSprites();
  $('#hlm-s-xm-state').textContent = g1 ? '已消失' : '在场';
  $('#hlm-s-sz-state').textContent = g2 ? '已消失' : '在场';
  const goneTag = $('#hlm-gone-tag');
  const goneName = g1 ? '林小满' : g2 ? '宋昭' : '';
  goneTag.style.display = goneName ? '' : 'none';
  if (goneName) goneTag.textContent = '「' + goneName + '」已从这条世界线上消失';
  updateTabs();
  renderDiary();
}
function isGone(who){ return !!(statRef && statRef.角色状态 && statRef.角色状态[who + '是否消失']); }
function fetchStat(cb){
  let tries = 0;
  (function tick(){
    try {
      if (typeof getVariables === 'function'){
        getVariables({ type: 'message' }).then(v => {
          const sd = v && (v.stat_data || v);
          if (sd && sd.好感度){ cb(sd); return; }
          if (++tries < 12) setTimeout(tick, 600);
        }).catch(() => { if (++tries < 12) setTimeout(tick, 600); });
      } else if (++tries < 4) setTimeout(tick, 800);
    } catch(e){}
  })();
}
try {
  if (typeof eventOn === 'function') eventOn('mag_variable_updated', () => fetchStat(d => applyStat(d)));
} catch(e){}
fetchStat(applyStat);
applyStat(null);
layoutSprites();

/* ---------- 逐行推进(真·galgame):文本框只显示当前一行,已读行替换不堆叠;
   名字/旁白在左上角名牌;首次开口立绘登场并弹出,非默认表情换图时弹一次;
   支持:自动播放AUTO / 回退BACK / 隐藏界面HIDE / 对话记录LOG ---------- */
const storyEl = $('#hlm-story'), spkEl = $('#hlm-speaker');
const AUTO_BASE = 1400, AUTO_PER_CHAR = 75;   /* 自动播放节奏:基础延时+每字延时(可调) */
let autoOn = false, autoTimer = null, hideOn = false;
function popSprite(who){
  const el = $('#hlm-sprite-' + (who === '林小满' ? 'xm' : who === '宋昭' ? 'sz' : 'npc'));
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
}
/* NPC 换图:识别到新形象的 NPC 开口时更新第三立绘位 */
function updateNpcSprite(){
  const el = $('#hlm-sprite-npc'); if (!el) return;
  const url = (npcState && npcState.arch && NPC_IMG[npcState.arch]) || '';
  if (!url){ el.style.backgroundImage = ''; return; }
  const img = new Image();
  img.onload = () => { el.style.backgroundImage = 'url("'+url+'")'; };
  img.onerror = () => { el.style.backgroundImage = ''; };
  img.src = url;
}
/* 纯函数:重放前n行,得到第n行时刻的登场/表情/说话人状态 → 回退也能精确还原。
   NPC只在她说台词的那一行显示(话轮一走自动淡出),无需离场标记 */
function computeState(n){
  const en = { '林小满':false, '宋昭':false }, fc = { '林小满':'普通', '宋昭':'普通' };
  let sp = '', npc = null;
  for (let i = 0; i < n; i++){
    const L = lines[i];
    if (L.name === '林小满' || L.name === '宋昭'){
      sp = L.name;
      if (!en[L.name]){ en[L.name] = true; fc[L.name] = L.face || '普通'; }
      else if (L.face && L.face !== fc[L.name]) fc[L.name] = L.face;
    }
  }
  const last = lines[n - 1];
  if (last && last.isNpc && last.npc) npc = { name:last.name, arch:last.npc };
  return { en:en, fc:fc, sp:sp, npc:npc };
}
function applyLine(n, pop){
  shown = n;
  const prevFace = { '林小满':curFace['林小满'], '宋昭':curFace['宋昭'] };
  const wasEntered = { '林小满':entered['林小满'], '宋昭':entered['宋昭'] };
  const prevNpc = npcState;
  const st = computeState(n);
  entered['林小满'] = st.en['林小满']; entered['宋昭'] = st.en['宋昭'];
  curFace['林小满'] = st.fc['林小满']; curFace['宋昭'] = st.fc['宋昭'];
  curSpeaker = st.sp;
  npcState = st.npc;
  ['林小满','宋昭'].forEach(w => { if (entered[w] && curFace[w] !== prevFace[w]) setSprite(w, curFace[w]); });
  if (!prevNpc || !npcState || prevNpc.name !== npcState.name || prevNpc.arch !== npcState.arch) updateNpcSprite();
  ['林小满','宋昭'].forEach(w => { if (entered[w] && curFace[w] !== prevFace[w]) setSprite(w, curFace[w]); });
  const L = lines[n - 1];
  storyEl.innerHTML = (L && L.text) ? (L.name
    ? '<p class="hlm-dlg">' + fmt(L.text) + '</p>'
    : '<p>' + fmt(L.text) + '</p>') : '';
  $('#hlm-next').style.display = n < lines.length ? '' : 'none';
  if (L){
    if (L.name){
      spkEl.textContent = L.name;
      spkEl.className = L.name === '林小满' ? 'xm' : L.name === '宋昭' ? 'sz' : 'u';
    } else { spkEl.textContent = '旁白'; spkEl.className = 'n'; }
    if (pop && (L.name === '林小满' || L.name === '宋昭')){
      if (!wasEntered[L.name]) popSprite(L.name);                                            /* 首次登场弹 */
      else if (L.face && L.face !== prevFace[L.name] && L.face !== '普通') popSprite(L.name); /* 换非默认表情弹 */
    }
    if (pop && L.isNpc && (!prevNpc || prevNpc.name !== L.name)) popSprite('npc');            /* NPC换人弹 */
  }
  layoutSprites();
  renderLog();
}
function advance(pop){
  if (shown >= lines.length) return;
  applyLine(shown + 1, pop);
  if (autoOn){ if (shown >= lines.length) stopAuto(); else queueAuto(); }   /* 手动推进也重置自动计时 */
}
function back(){ if (shown > 1){ stopAuto(); applyLine(shown - 1, false); } }
/* 自动播放:按行长动态延时,读完最后一行自动停 */
function stopAuto(){
  autoOn = false; clearTimeout(autoTimer);
  $('#hlm-btn-auto').classList.remove('on');
  $('#hlm-btn-auto').querySelector('.hlm-qico').textContent = '▶';
}
function startAuto(){
  if (shown >= lines.length) return;
  autoOn = true;
  $('#hlm-btn-auto').classList.add('on');
  $('#hlm-btn-auto').querySelector('.hlm-qico').textContent = '❚❚';
  queueAuto();
}
function queueAuto(){
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => { if (autoOn) advance(true); },
    AUTO_BASE + Math.min(4600, ((lines[shown - 1] || {}).text || '').length * AUTO_PER_CHAR));
}
/* 隐藏界面:只剩背景与立绘,点一下恢复 */
function setHide(v){ hideOn = v; app.classList.toggle('hideui', v); }
/* 对话记录:只收录已读行,当前行高亮 */
function renderLog(){
  const list = $('#hlm-log-list'); if (!list) return;
  list.innerHTML = lines.slice(0, shown).map((L, i) => {
    const cls = L.name === '林小满' ? 'xm' : L.name === '宋昭' ? 'sz' : L.name ? 'u' : 'n';
    return '<div class="hlm-log-item' + (i === shown - 1 ? ' hlm-log-cur' : '') + '"><span class="l-name ' + cls + '">' + esc(L.name || '旁白') + '</span><span class="l-text">' + fmt(L.text) + '</span></div>';
  }).join('') || '<div class="hlm-empty">还没有内容</div>';
}
function toggleLog(){
  const m = $('#hlm-modal-log');
  if (m.classList.contains('open')){ m.classList.remove('open'); return; }
  renderLog(); m.classList.add('open');
  requestAnimationFrame(() => { const s = m.querySelector('.hlm-sheet'); if (s) s.scrollTop = s.scrollHeight; });
}
/* 交互:点击推进(隐藏态先恢复);键盘:空格/回车推进 ←回退 →前进 A自动 H隐藏 L记录 */
app.addEventListener('click', e => {
  if (e.target.closest('.hlm-modal') || e.target.closest('button')) return;   /* 按钮自己的事,不推进也不恢复 */
  if (hideOn){ setHide(false); return; }
  advance(true);
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); if (hideOn) setHide(false); else advance(true); }
  else if (e.key === 'ArrowLeft') back();
  else if (e.key === 'ArrowRight') advance(true);
  else if (e.key === 'a' || e.key === 'A') autoOn ? stopAuto() : startAuto();
  else if (e.key === 'h' || e.key === 'H') setHide(!hideOn);
  else if (e.key === 'l' || e.key === 'L') toggleLog();
});
$('#hlm-btn-back').addEventListener('click', back);
$('#hlm-btn-auto').addEventListener('click', () => autoOn ? stopAuto() : startAuto());
$('#hlm-btn-log').addEventListener('click', toggleLog);
$('#hlm-btn-hide').addEventListener('click', () => setHide(true));
$('#hlm-modal-log').addEventListener('click', e => { if (e.target.id === 'hlm-modal-log') e.target.classList.remove('open'); });
if (lines.length){ applyLine(1, false); }

/* ---------- 日记：只有消失的那个人格的日记才会显现 ---------- */
function updateTabs(){
  document.querySelectorAll('.hlm-tab').forEach(t => {
    const gone = isGone(t.dataset.who);
    t.classList.toggle('locked', !gone);
    const base = t.dataset.who + '的日记';
    t.textContent = (gone ? '' : '🔒 ') + base;
  });
  if (isGone('宋昭') && !isGone('林小满')) curTab = '宋昭日记';
  else if (isGone('林小满')) curTab = '林小满日记';
  document.querySelectorAll('.hlm-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === curTab));
}
function renderDiary(){
  const list = $('#hlm-diary-list');
  const who = curTab === '林小满日记' ? '林小满' : '宋昭';
  if (!isGone(who)){
    list.innerHTML = '<div class="hlm-diary-lock"><span class="lk">🔒</span>她还在这个世界上。<br>只有当这个人格消失之后，<br>她独自写下的日记才会显现。</div>';
    return;
  }
  const src = (statRef && statRef[curTab]) || {};
  const keys = Object.keys(src).sort();
  list.innerHTML = keys.length ? keys.map((k, i) =>
    '<div class="hlm-diary-item"><div class="d-date">No.' + String(i + 1).padStart(3, '0') + ' · ' + esc(src[k].日期 || k) + '</div><div class="d-body">' + esc(src[k].日记正文 || '') + '</div></div>'
  ).join('') : '<div class="hlm-empty">日记里还没有字迹</div>';
}
document.querySelectorAll('.hlm-tab').forEach(t => t.addEventListener('click', () => {
  curTab = t.dataset.tab;
  document.querySelectorAll('.hlm-tab').forEach(x => x.classList.toggle('active', x === t));
  renderDiary();
}));

/* ---------- 弹窗与全屏 ---------- */
$('#hlm-btn-status').addEventListener('click', () => $('#hlm-modal-status').classList.add('open'));
$('#hlm-btn-diary').addEventListener('click', () => $('#hlm-modal-diary').classList.add('open'));
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => $('#' + b.dataset.close).classList.remove('open')));

let fsOn = false, savedStyle = null;
$('#hlm-btn-fs').addEventListener('click', toggleFs);
function toggleFs(){
  fsOn = !fsOn;
  app.classList.toggle('fs', fsOn);
  if (fsOn){
    try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); } catch(e){}
    try {
      const f = window.frameElement;
      if (f){
        savedStyle = f.getAttribute('style') || '';
        Object.assign(f.style, { position:'fixed', inset:'0', width:'100vw', height:'100vh', zIndex:99999, background:'#000' });
      }
    } catch(e){}
  } else {
    try { document.fullscreenElement && document.exitFullscreen(); } catch(e){}
    try {
      const f = window.frameElement;
      if (f && savedStyle !== null) f.setAttribute('style', savedStyle);
    } catch(e){}
  }
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && fsOn) toggleFs(); });

/* 调试钩子:仅供本地预览控制台使用,酒馆内无人调用 */
window.__hlm = { world: world, applyWorld: applyWorld, advance: () => advance(true), back: back };
})();
</script>
