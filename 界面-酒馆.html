<meta charset="utf-8">
<div id="hlm-app" data-weather="晴">
  <div class="hlm-bg" id="hlm-bg">
    <i class="hlm-cloud c1"></i><i class="hlm-cloud c2"></i><i class="hlm-cloud c3"></i>
    <i class="hlm-sun"></i>
  </div>
  <div class="hlm-fx" id="hlm-fx"></div>

  <div class="hlm-topinfo">
    <span class="hlm-world"><i id="hlm-date">—</i><em></em><i id="hlm-time">—</i><em></em><i id="hlm-weather">—</i><em></em><i id="hlm-loc">—</i></span>
    <span class="hlm-favor">
      <span class="xm">林小满 <b id="hlm-xm-num">50</b></span>
      <span class="hlm-minibar"><span class="hlm-minibar-xm" id="hlm-bar-xm"></span></span>
      <span class="sz"><b id="hlm-sz-num">50</b> 宋昭</span>
    </span>
  </div>

  <div class="hlm-topmenu">
    <button class="hlm-tbtn" id="hlm-tb-plan">✎ 思路</button>
    <button class="hlm-tbtn" id="hlm-tb-var">☰ 变量</button>
  </div>

  <div class="hlm-stage">
    <div class="hlm-sprite xm" id="hlm-sprite-xm"><div class="hlm-stand"><span>林小满</span></div></div>
    <div class="hlm-sprite sz" id="hlm-sprite-sz"><div class="hlm-stand"><span>宋昭</span></div></div>
    <div class="hlm-sprite npc" id="hlm-sprite-npc"></div>
    <div class="hlm-gone-tag" id="hlm-gone-tag" style="display:none"></div>
  </div>

  <div class="hlm-band">
    <div class="hlm-speaker"><span id="hlm-speaker">幻想肥皂泡</span></div>
    <main class="hlm-story" id="hlm-story"></main>
    <i class="hlm-band-orn big">❀</i>
    <i class="hlm-band-orn small">❀</i>
    <i class="hlm-next" id="hlm-next" style="display:none">▼</i>
    <i class="hlm-band-flower">❀</i>
  </div>

  <nav class="hlm-quicknav">
    <button class="hlm-qitem" id="hlm-btn-send" data-tip="输入回复"><span class="hlm-qico">✉</span></button>
    <button class="hlm-qitem" id="hlm-btn-back" data-tip="回上一行"><span class="hlm-qico">↶</span></button>
    <button class="hlm-qitem" id="hlm-btn-auto" data-tip="自动播放"><span class="hlm-qico">▶</span></button>
    <button class="hlm-qitem" id="hlm-btn-log" data-tip="对话记录"><span class="hlm-qico">▤</span></button>
    <button class="hlm-qitem" id="hlm-btn-hide" data-tip="隐藏界面"><span class="hlm-qico">◻</span></button>
    <button class="hlm-qitem" id="hlm-btn-diary" data-tip="日记"><span class="hlm-qico">❒</span></button>
    <button class="hlm-qitem" id="hlm-btn-fs" data-tip="全屏"><span class="hlm-qico">⛶</span></button>
  </nav>

  <div class="hlm-modal" id="hlm-modal-var">
    <div class="hlm-sheet">
      <div class="hlm-sheet-head"><span class="hlm-s-cn">变量</span><span class="hlm-s-en">VARIABLES</span><button class="hlm-x" data-close="hlm-modal-var">✕</button></div>
      <div class="hlm-var-block" id="hlm-var-block">
        <div class="hlm-var-title">── 本轮变量变更 ──</div>
        <div id="hlm-var-list"></div>
      </div>
    </div>
  </div>

  <div class="hlm-modal" id="hlm-modal-plan">
    <div class="hlm-sheet">
      <div class="hlm-sheet-head"><span class="hlm-s-cn">思路</span><span class="hlm-s-en">PLANNING</span><button class="hlm-x" data-close="hlm-modal-plan">✕</button></div>
      <pre class="hlm-plan-text" id="hlm-plan-text"></pre>
    </div>
  </div>

  <div class="hlm-modal" id="hlm-modal-diary">
    <div class="hlm-sheet hlm-diary-sheet">
      <div class="hlm-sheet-head">
        <span class="hlm-tab xm" data-tab="林小满日记" data-who="林小满">林小满的日记</span>
        <span class="hlm-vline"></span>
        <span class="hlm-tab sz" data-tab="宋昭日记" data-who="宋昭">宋昭的日记</span>
        <button class="hlm-x" data-close="hlm-modal-diary">✕</button>
      </div>
      <div class="hlm-diary-list" id="hlm-diary-list"></div>
    </div>
  </div>
  <div class="hlm-modal" id="hlm-modal-log">
    <div class="hlm-sheet">
      <div class="hlm-sheet-head"><span class="hlm-s-cn">对话记录</span><span class="hlm-s-en">BACKLOG</span><button class="hlm-x" data-close="hlm-modal-log">✕</button></div>
      <div class="hlm-diary-list" id="hlm-log-list"></div>
    </div>
  </div>
</div>

<style>
@import url('https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-400.css');
@import url('https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/chinese-simplified-700.css');
#hlm-app{position:relative;height:720px;border-radius:14px;overflow:hidden;
  font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#3b414b;background:#9ec7e8;
  display:flex;flex-direction:column;--xm:#e2647e;--sz:#5a8fc0;--rose:#d95f7f;
  box-shadow:0 10px 40px rgba(30,50,70,.35)}
#hlm-app.fs{height:100vh;border-radius:0}
#hlm-app *,#hlm-app *::before,#hlm-app *::after{box-sizing:border-box}

/* ── 背景:通栏无遮挡 ── */
.hlm-bg{position:absolute;inset:0;background-size:cover;background-position:center;
  background-image:linear-gradient(180deg,#6fb0e3 0%,#9cc9ea 42%,#cfe6f2 68%,#f3efe6 100%)}
.hlm-bg.hasimg .hlm-cloud,.hlm-bg.hasimg .hlm-sun{display:none}
.hlm-cloud{position:absolute;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0));
  border-radius:50%;filter:blur(2px)}
.hlm-cloud.c1{left:6%;top:10%;width:34%;height:16%}
.hlm-cloud.c2{left:52%;top:22%;width:28%;height:12%;opacity:.85}
.hlm-cloud.c3{left:26%;top:34%;width:22%;height:9%;opacity:.7}
.hlm-sun{position:absolute;right:14%;top:6%;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,252,235,.9),rgba(255,250,220,0) 70%)}
.hlm-fx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.hlm-fx .star{position:absolute;font-size:11px;color:rgba(255,255,255,.9);animation:twk 4s ease-in-out infinite;font-style:normal}
.hlm-fx .mote{position:absolute;bottom:-14px;font-size:11px;opacity:0;animation:rise 12s linear infinite;font-style:normal}
#hlm-app[data-weather="雨"] .hlm-fx .rain{position:absolute;inset:0;
  background:repeating-linear-gradient(100deg,transparent 0 15px,rgba(120,150,200,.13) 15px 16px);
  background-size:220px 260px;animation:rainfall 1s linear infinite}
#hlm-app[data-weather="雨"] .hlm-bg{filter:saturate(.7) brightness(.75)}
#hlm-app[data-weather="阴"] .hlm-bg{filter:saturate(.6) brightness(.88)}
@keyframes twk{0%,100%{opacity:.1;transform:scale(.8)}50%{opacity:.9;transform:scale(1.25)}}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.55}80%{opacity:.2}100%{transform:translateY(-90vh) translateX(3vw);opacity:0}}
@keyframes rainfall{to{background-position:-90px 260px}}

/* ── 顶部一行极简信息 ── */
.hlm-topinfo{position:absolute;z-index:6;top:12px;left:18px;right:18px;display:flex;justify-content:space-between;
  align-items:center;font-size:12px;letter-spacing:1.5px;color:rgba(55,80,105,.85);
  text-shadow:0 0 6px rgba(255,255,255,.95),0 0 14px rgba(255,255,255,.8);font-variant-numeric:tabular-nums}
/* 顶栏菜单栏(加大) */
.hlm-topmenu{position:absolute;z-index:7;top:34px;left:18px;right:18px;display:flex;gap:9px;flex-wrap:wrap}
.hlm-tbtn{background:rgba(255,255,255,.5);border:1px solid rgba(59,65,75,.14);border-radius:8px;
  color:rgba(60,80,100,.85);font-family:inherit;font-size:13px;letter-spacing:1.5px;cursor:pointer;
  padding:6px 16px;backdrop-filter:blur(6px);transition:all .15s;text-shadow:0 0 4px rgba(255,255,255,.6)}
.hlm-tbtn:hover{color:var(--rose);border-color:rgba(217,95,127,.45);background:rgba(255,255,255,.75)}
.hlm-tbtn.on{color:var(--rose);border-color:rgba(217,95,127,.55)}
#hlm-app.hideui .hlm-topmenu{display:none}
/* 发送输入条(点"发送"按钮弹出,悬于对话框上方) */
.hlm-inputbar{position:absolute;z-index:8;left:8%;right:8%;bottom:70px;display:flex;gap:10px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border:1px solid rgba(217,95,127,.3);
  border-radius:8px;padding:10px 14px;box-shadow:0 6px 24px rgba(40,60,80,.28)}
.hlm-inputbar input{flex:1;background:none;border:none;outline:none;font-family:'Noto Serif SC','SimSun',serif;
  font-size:14px;color:#333a45;letter-spacing:.5px}
.hlm-inputbar input::placeholder{color:rgba(59,65,75,.4)}
.hlm-inputbar button{background:none;color:var(--rose);border:1px solid rgba(217,95,127,.55);border-radius:2px;
  padding:6px 20px;font-size:13px;cursor:pointer;font-family:'Noto Serif SC','SimSun',serif;letter-spacing:4px;font-weight:700;transition:all .15s}
.hlm-inputbar button:hover{background:rgba(217,95,127,.12)}
#hlm-app.hideui .hlm-inputbar{display:none !important}
.hlm-world{display:flex;align-items:center;gap:8px}
.hlm-world em{width:3px;height:3px;border-radius:50%;background:rgba(217,95,127,.55)}
.hlm-favor{display:flex;align-items:center;gap:9px}
.hlm-favor .xm{color:var(--xm)}.hlm-favor .sz{color:var(--sz)}
.hlm-favor b{font-size:14px;font-weight:700}
.hlm-minibar{position:relative;width:58px;height:3px;border-radius:2px;background:var(--sz);overflow:hidden;opacity:.75}
.hlm-minibar-xm{position:absolute;left:0;top:0;height:100%;width:50%;background:var(--xm);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.pulse{animation:pls .9s ease}
@keyframes pls{0%,100%{opacity:1}40%{opacity:.3}}

/* ── 立绘:底边锚定在界面最底端(藏在文字横带后),放大只会向上生长,不会露出底边 ── */
.hlm-stage{position:absolute;inset:0;z-index:2;pointer-events:none}
.hlm-sprite{position:absolute;bottom:0;height:100%;width:48%;max-width:640px;transform:translateX(-50%);opacity:0;
  transition:left 1.1s cubic-bezier(.3,.8,.3,1),opacity 1s,filter 1s;
  background-size:contain;background-repeat:no-repeat;background-position:bottom center}
.hlm-sprite.xm{left:46%}.hlm-sprite.sz{left:58%}
.hlm-sprite.npc{left:6%;opacity:0}
.hlm-stand{position:absolute;left:50%;bottom:30%;transform:translateX(-50%);writing-mode:vertical-rl;
  font-family:'Noto Serif SC','SimSun',serif;font-size:19px;letter-spacing:14px;color:rgba(60,85,110,.5);
  border-left:1px solid rgba(60,85,110,.25);padding-left:12px;text-shadow:0 0 8px rgba(255,255,255,.8)}
.hlm-sprite:not(.noimg) .hlm-stand{display:none}
.hlm-sprite.gone{opacity:.04;filter:grayscale(1) blur(4px)}
.hlm-gone-tag{position:absolute;top:14px;left:50%;transform:translateX(-50%);
  font-family:'Noto Serif SC','SimSun',serif;font-size:14px;letter-spacing:4px;color:var(--rose);
  text-shadow:0 0 10px rgba(255,255,255,.95)}

/* ── 快捷菜单:参考图式通栏彩色小图标 ── */
.hlm-quicknav{position:relative;z-index:6;display:flex;justify-content:center;gap:14px;padding:8px 0 10px}
.hlm-qitem{position:relative;display:flex;align-items:center;justify-content:center;width:46px;height:40px;
  background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.6);border-radius:12px;cursor:pointer;
  color:rgba(75,100,125,.85);font-family:inherit;transition:all .15s;backdrop-filter:blur(6px);
  box-shadow:0 2px 8px rgba(60,90,110,.18)}
.hlm-qitem:hover{transform:translateY(-3px);box-shadow:0 5px 14px rgba(60,90,110,.3)}
.hlm-qitem.on{color:var(--rose);border-color:rgba(217,95,127,.55)}
.hlm-qitem::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:rgba(50,60,75,.92);color:#fff;font-size:11px;letter-spacing:1px;padding:4px 10px;border-radius:6px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.hlm-qitem:hover::after{opacity:1}
.hlm-qitem:nth-child(1) .hlm-qico{color:#e2647e}
.hlm-qitem:nth-child(2) .hlm-qico{color:#5a8fc0}
.hlm-qitem:nth-child(3) .hlm-qico{color:#e8a23c}
.hlm-qitem:nth-child(4) .hlm-qico{color:#7bb08a}
.hlm-qitem:nth-child(5) .hlm-qico{color:#9a7bc9}
.hlm-qitem:nth-child(6) .hlm-qico{color:#d477a5}
.hlm-qitem:nth-child(7) .hlm-qico{color:#6fb3c9}
.hlm-qico{font-size:19px;line-height:1;font-style:normal}
.hlm-qitem.on .hlm-qico{color:var(--rose)}
/* 每颗图标一个浅彩(参考图 DATA SAVE 粉 / DATA LOAD 蓝 / AUTO 黄 那种) */
.hlm-qitem:nth-child(1) .hlm-qico{color:#f5a8c0}
.hlm-qitem:nth-child(2) .hlm-qico{color:#ffd97a}
.hlm-qitem:nth-child(3) .hlm-qico{color:#9fd8ff}
.hlm-qitem:nth-child(4) .hlm-qico{color:#c9c9d6}
.hlm-qitem:nth-child(5) .hlm-qico{color:#ffb3c8}
.hlm-qitem:nth-child(6) .hlm-qico{color:#a8d8b0}
.hlm-qitem:nth-child(7) .hlm-qico{color:#d8b8f0}
/* 隐藏界面:只剩背景与立绘,点击任意处恢复 */
#hlm-app.hideui .hlm-band,#hlm-app.hideui .hlm-topinfo,#hlm-app.hideui .hlm-quicknav{display:none}

/* ── 正文:通栏白色横带(参考图:半透明磨砂,景色透出) ── */
.hlm-band{position:relative;z-index:5;margin-top:auto;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.58) 45%,rgba(255,255,255,.70));
  backdrop-filter:blur(5px);padding:0 7% 16px;min-height:200px;overflow:hidden}
.hlm-band::before{content:'';position:absolute;left:0;right:0;top:-90px;height:90px;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.42));pointer-events:none}
.hlm-band-flower{position:absolute;right:4%;bottom:6px;font-size:40px;font-style:normal;color:var(--rose);opacity:.14;pointer-events:none}
/* 花纹:用粒子里同款 ❀ 花,大朵在右、小朵偏中,极低透明度 */
.hlm-band-orn{position:absolute;pointer-events:none;font-style:normal;line-height:1}
.hlm-band-orn.big{right:5%;top:30%;font-size:110px;color:#f5b8cd;opacity:.28;transform:rotate(-14deg)}
.hlm-band-orn.big::after{content:'❀';position:absolute;left:-96px;top:52px;font-size:46px;color:#a8cdec;opacity:.8;transform:rotate(26deg)}
.hlm-band-orn.small{right:15%;bottom:-22px;font-size:56px;color:#a8cdec;opacity:.26;transform:rotate(18deg)}
.hlm-band-orn.small::after{content:'❀';position:absolute;left:86px;top:-14px;font-size:34px;color:#f5b8cd;opacity:.7;transform:rotate(-32deg)}
.hlm-speaker{display:flex;align-items:center;gap:14px;margin:6px 0 6px 1.5%}
.hlm-speaker::before{content:'';width:70px;height:1px;background:linear-gradient(90deg,transparent,var(--rose));opacity:.9}
.hlm-speaker span{font-family:'Noto Serif SC','SimSun',serif;font-size:21px;letter-spacing:7px;color:var(--rose);font-weight:700;
  text-shadow:0 1px 8px rgba(255,255,255,.85)}
.hlm-story{max-height:230px;overflow-y:auto;font-family:'Noto Serif SC','Source Han Serif SC','SimSun',serif;
  font-size:17.5px;line-height:2.15;letter-spacing:.6px;color:#333a45;scrollbar-width:thin;
  text-shadow:0 0 8px rgba(255,255,255,.65),0 1px 2px rgba(255,255,255,.5)}
#hlm-app ::-webkit-scrollbar{width:4px}
#hlm-app ::-webkit-scrollbar-thumb{background:rgba(90,120,150,.3);border-radius:2px}
.hlm-story p{margin:0;text-indent:2em}
.hlm-story p + p{margin-top:.6em}
.hlm-story b{color:var(--rose);font-weight:700}
/* 发送栏 */
.hlm-inputrow{display:flex;gap:10px;margin-top:14px}
.hlm-inputrow input{flex:1;background:rgba(255,255,255,.55);border:none;border-bottom:1.5px solid rgba(217,95,127,.45);
  border-radius:0;padding:8px 4px;font-family:'Noto Serif SC','SimSun',serif;font-size:14px;color:#333a45;outline:none;letter-spacing:.5px}
.hlm-inputrow input::placeholder{color:rgba(59,65,75,.4)}
.hlm-inputrow input:focus{border-bottom-color:var(--rose);background:rgba(255,255,255,.75)}
.hlm-inputrow button{background:none;color:var(--rose);border:1px solid rgba(217,95,127,.55);border-radius:2px;padding:7px 22px;
  font-size:13px;cursor:pointer;font-family:'Noto Serif SC','SimSun',serif;letter-spacing:4px;font-weight:700;transition:all .15s}
.hlm-inputrow button:hover{background:rgba(217,95,127,.12)}
/* 对话行:台词顶格,说话人显示在左上角名牌 */
.hlm-story .hlm-dlg{margin:0;text-indent:0}
#hlm-speaker.xm{color:var(--xm)}
#hlm-speaker.sz{color:var(--sz)}
#hlm-speaker.u{color:var(--rose)}
#hlm-speaker.n{color:rgba(59,65,75,.5)}
/* 待续箭头 & 立绘弹出动画 */
.hlm-next{position:absolute;right:16px;bottom:8px;font-style:normal;font-size:12px;color:var(--rose);
  cursor:pointer;z-index:2;animation:hlm-blink 1.1s ease-in-out infinite}
@keyframes hlm-blink{0%,100%{transform:translateY(0);opacity:.3}50%{transform:translateY(3px);opacity:1}}
.hlm-sprite.pop{animation:hlm-pop .5s cubic-bezier(.25,.9,.3,1.25)}
@keyframes hlm-pop{0%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.055)}100%{transform:translateX(-50%) scale(1)}}

/* ── 弹窗:白纸极简 ── */
.hlm-modal{position:absolute;inset:0;z-index:10;background:rgba(255,255,255,.28);backdrop-filter:blur(4px);
  display:none;align-items:flex-end}
.hlm-modal.open{display:flex}
.hlm-sheet{width:100%;max-height:72%;overflow-y:auto;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);
  border-top:1px solid rgba(217,95,127,.35);padding:18px 8% 22px;scrollbar-width:thin}
.hlm-sheet-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;border-bottom:1px solid rgba(59,65,75,.12);padding-bottom:10px}
.hlm-s-cn{font-family:'Noto Serif SC','SimSun',serif;font-size:17px;letter-spacing:6px;color:var(--rose);font-weight:700}
.hlm-s-en{font-size:9px;letter-spacing:3px;color:rgba(59,65,75,.45)}
.hlm-x{margin-left:auto;background:none;border:none;font-size:14px;color:rgba(59,65,75,.6);cursor:pointer;padding:4px 8px}
.hlm-x:hover{color:var(--rose)}
.hlm-kv{display:flex;justify-content:space-between;align-items:baseline;padding:9px 2px;border-bottom:1px solid rgba(59,65,75,.08);font-size:13px}
.hlm-kv span{color:rgba(59,65,75,.55);letter-spacing:1px;font-size:11.5px}
.hlm-kv b{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.hlm-kv .xm, .hlm-kv b.xm{color:var(--xm)}
.hlm-kv .sz, .hlm-kv b.sz{color:var(--sz)}
.hlm-note{text-align:center;color:rgba(59,65,75,.4);font-size:11px;padding-top:14px;letter-spacing:2px}
/* 日记 */
.hlm-tab{cursor:pointer;font-family:'Noto Serif SC','SimSun',serif;font-size:15px;letter-spacing:3px;
  color:rgba(59,65,75,.35);transition:color .2s;font-weight:700}
.hlm-tab.active{color:var(--rose)}
.hlm-tab.locked{opacity:.5}
.hlm-vline{width:1px;height:14px;background:rgba(59,65,75,.2);align-self:center}
.hlm-diary-list{display:flex;flex-direction:column;gap:14px}
.hlm-diary-item{padding:12px 4px 14px;border-bottom:1px solid rgba(59,65,75,.08)}
.hlm-diary-item .d-date{font-family:'Noto Serif SC','SimSun',serif;font-size:11.5px;letter-spacing:2px;
  color:var(--rose);margin-bottom:6px;font-variant-numeric:tabular-nums}
.hlm-diary-item .d-date::before{content:'— ';opacity:.6}

/* 正文来源优先级:①酒馆正则注入的最后一个<story>块(window.__HLM_STORY,贪婪匹配天然避开思维链)

let msgFull = '';

let planningText = '';   /* <konatan_planning~>思维链,顶栏"思路"查看 */

    const mp = msgFull.match(/<konatan_planning~>([\s\S]*?)(<\/konatan_planning~>|$)/);
    if (mp) planningText = mp[1].trim();
    const noPlan = stripPlanning(msgFull);

} else if (($('#hlm-story-raw') || {}).textContent){
  storyRaw = $('#hlm-story-raw').textContent;             /* ② 本地预览 */
} else {
  const noPlan = stripPlanning(msgFull);                   /* ③ API 兜底:取最后一个块 */
  const mlast = noPlan.match(/<story>([\s\S]*?)<\/story>([\s\S]*)$/);
  if (mlast) storyRaw = mlast[1];

const world = { 日期:'', 时间:'', 昼夜:'', 天气:'', 路径:[] };   /* 世界状态:随正文标签输出,每楼必达 */

/* 装载一段正文:解析<date>/<scene>标签并结构化行。可重复调用(如全屏中收到新回复时刷新) */
function loadStory(raw){
  world.日期 = ''; world.时间 = ''; world.昼夜 = ''; world.天气 = ''; world.路径 = [];
  world.在场 = {};
  shown = 0; curSpeaker = ''; npcState = null;
  curFace['林小满'] = '普通'; curFace['宋昭'] = '普通';
  entered['林小满'] = false; entered['宋昭'] = false;
  let text = raw;
  const grab = tag => {
    const m = text.match(new RegExp('<' + tag + '>([\\s\\S]*?)<\\/' + tag + '>'));
    if (!m) return '';
    text = text.replace(m[0], '');
    return m[1].trim();
  };
  const pRaw = grab('在场');
  if (pRaw){
    for (const n of pRaw.split(/[、,，|｜\s]+/)){
      const who = nameFix[n.trim()] || n.trim();
      if (who === '林小满' || who === '宋昭') world.在场[who] = true;
    }
  }
  const dRaw = grab('date');
  const mDT = dRaw.match(/^(\d{4}年\d{1,2}月\d{1,2}日)\s*(?:(\d{1,2}[时点]\d{1,2}分?)\s*)?(.*)$/);
  world.日期 = mDT ? mDT[1] + (mDT[3] ? ' ' + mDT[3].trim() : '') : dRaw;
  world.时间 = mDT && mDT[2] ? mDT[2] : '';
  const isW = s => /^(晴|阴|雨)天?$/.test(s);
  const isD = s => /^(昼|夜|白昼|白天|夜晚|凌晨|清晨|早晨|早上|上午|中午|午后|下午|傍晚|黄昏|深夜)$/.test(s);
  const segs = grab('scene').split('/').map(s => s.trim()).filter(Boolean);
  for (let i = 0; i < 2 && segs.length; i++){
    const s = segs[segs.length - 1];
    if (!world.天气 && isW(s)){ world.天气 = s.replace(/天$/, ''); segs.pop(); }
    else if (!world.昼夜 && isD(s)){ world.昼夜 = s; segs.pop(); }
    else break;
  }
  world.路径 = segs;
  /* 中途标签:<scene>…</scene> / <date>…</date> 可出现在正文行之间,推进到它时切换背景/时间(不占阅读格) */
  lines = [];
  for (const seg of text.split(/\n+/)){
    const s = seg.trim();
    if (!s) continue;
    const mSc = s.match(/^<scene>([\s\S]*?)<\/scene>$/);
    if (mSc){ lines.push({ marker:'scene', sceneRaw:mSc[1].trim(), text:'' }); continue; }
    const mDt = s.match(/^<date>([\s\S]*?)<\/date>$/);
    if (mDt){ lines.push({ marker:'date', dateRaw:mDt[1].trim(), text:'' }); continue; }
    const L = parseLine(s);
    if (L.text || L.marker) lines.push(L);

};
const NPC_PAT = [
  ['女年轻', /女年轻|女青年|少女|女孩|女生|店员|服务员|前台|小姐|妹子|学妹/],
  ['女中年', /女中年|阿姨|大婶|老板娘|大妈|母亲|妈妈|婶|护士/],
  ['女老年', /女老年|奶奶|外婆|老太/],
  ['男年轻', /男年轻|男青年|少年|男孩|男生|小哥|学弟|快递/],
  ['男中年', /男中年|大叔|叔叔|老板|师傅|父亲|爸爸|保安|老师/],
  ['男老年', /男老年|爷爷|外公|老头/]
];
function npcArchetype(name, bracket){
  /* 规范写法:[男青年]/[女老年] 等"性别+年龄"组合,括号里写了的维度一定生效;
     缺性别时从称呼猜(如 阿姨→女),缺年龄时从称呼猜(如 大叔→中年),都没有按缺省补(男/中年) */
  const GENDER_HINT = /少女|女孩|女生|小姐|妹子|阿姨|大妈|妈|奶|婆|姐|嫂|女|祖母|外婆/;
  const b = (bracket || '').replace(/性/g, '');
  const gender = /男/.test(b) ? '男' : /女/.test(b) ? '女' : '';
  const age = /青年|年轻/.test(b) ? '年轻' : /中年/.test(b) ? '中年' : /老年/.test(b) ? '老年' : '';
  const s = (name || '') + ' ' + (bracket || '');
  for (const [k, re] of NPC_PAT){
    if (gender && age) break;                                  /* 括号齐全,称呼表不再参与 */
    if (re.test(s) && (!gender || k[0] === gender) && (!age || k.slice(1) === age)) return k;
  }
  if (gender && age) return gender + age;
  if (gender){
    const ageFromName = NPC_PAT.find(([k, re]) => re.test(s));  /* 缺年龄:称呼里的年龄段可借,性别以括号为准 */
    return gender + (age || (ageFromName ? ageFromName[0].slice(1) : '中年'));
  }
  if (age) return (GENDER_HINT.test(s) ? '女' : '男') + age;
  for (const [k, re] of NPC_PAT) if (re.test(s)) return k;
  return '男中年';                                              /* 完全无线索时的兜底形象 */
}
const parseLine = l => {

  const mk = l.match(/^\[\s*([^\]]*离场[^\]]*)\s*\]$/);
  if (mk){
    const names = mk[1].replace(/离场/g, '').split(/[\/、,，|｜\s]+/).map(s => nameFix[s.trim()] || s.trim()).filter(Boolean);
    return { marker:'exit', names:names, text:'' };
  }
  const m = l.match(/^(.{1,12}?)\s*\[([^\]]*)\]\s*[:：]\s*([\s\S]*)$/);          /* 名字 [表情/形象]: "台词" */
  if (m){
    const who = nameFix[m[1].trim()] || m[1].trim();
    const f = m[2].trim();
    if (who === '林小满' || who === '宋昭'){
      return { name:who, face:(!f || f === '默认') ? '普通' : f.replace(/离场|·/g, ''), text:stripQ(m[3].trim()) };
    }
    /* NPC带[]行:形象直写或按名字猜;NPC本就只在台词行显示 */
    return { name:who, face:'', npc:npcArchetype(who, f.replace(/离场|·/g, '')), isNpc:true, text:stripQ(m[3].trim()) };
  }
  const mn = l.match(/^旁白\s*[:：]\s*([\s\S]*)$/);                               /* 旁白: */
  if (mn) return { name:'', face:'', text:mn[1].trim() };
  const mu = l.match(/^(.{1,20}?)\s*[:：]\s*["“]([\s\S]*)$/);                    /* 名字: "台词"({{user}}等,不带表情) */
  if (mu){
    const who = nameFix[mu[1].trim()] || mu[1].trim();

    const g = npcArchetype(who, '');
    return { name:who, face:'', npc:g, isNpc:true, text:stripQ(mu[2].trim()) };
  }
  return { name:'', face:'', text:l };
};

/* 背景三级解析:精确命中 → 别名 → 关键词归类到通用层 → 默认 */
/* 场景解析(段与段有上下文关系):从最深层往外,每段依次
   ①精确键(含"父段+当前段"组合) ②别名(叶子名优先,长键优先)
   关键词只作记录、全程走完仍未命中才兜底——保证"宋昭的卧室"能赢过浅层的"宋昭家" */
function resolveScene(path){
  const segs = String(path || '').split('/').map(s => s.trim()).filter(Boolean);
  const ks = Object.keys(ASSETS.场景别名).sort((a, b) => b.length - a.length);
  let kwHit = '';
  for (let i = segs.length - 1; i >= 0; i--){
    const s = segs[i], combo = (i > 0 ? segs[i-1] : '') + s;
    if (ASSETS.背景[s]) return s;
    if (ASSETS.背景[combo]) return combo;
    const a = ks.find(k => s.includes(k)) || ks.find(k => combo.includes(k));
    if (a && ASSETS.背景[ASSETS.场景别名[a]]) return ASSETS.场景别名[a];
    if (!kwHit){
      for (const [p, c] of ASSETS.场景关键词){
        if (new RegExp(p).test(s) && ASSETS.背景[c]){ kwHit = c; break; }
      }
    }
  }
  return ASSETS.背景[kwHit] ? kwHit : '默认';
}
function pickBgUrl(name){
  const v = ASSETS.背景[resolveScene(name)] || ASSETS.背景['默认'];
  if (!v) return '';
  if (typeof v === 'string') return v;
  /* 对象写法按 天气+昼夜 选图,键:晴/阴/雨/晴夜/阴夜/雨夜/默认 */
  const w = app.dataset.weather || '晴';
  return v[w + (nightOn ? '夜' : '')] || v[w] || v['默认'] || v['晴'] || '';
}
function setBg(name){
  const url = pickBgUrl(name);
  if (!url) return;

  img.onerror = ()=>{};

}
function setSprite(who, expr){

/* 立绘站位:只显示已登场且未消失的人格;主位(当前说话人)居中且置顶,其余往左;
   NPC 占 girls 之后的槽位(换人即换图,没有可识别形象就不显示);无人在场时舞台清空 */
function layoutSprites(){
  const chars = ['林小满', '宋昭'];
  const present = chars.filter(c => entered[c] && !isGone(c));
  const primary = (curSpeaker && present.includes(curSpeaker)) ? curSpeaker : present[0];
  const order = primary ? [primary].concat(present.filter(c => c !== primary)) : [];
  const pos = ['50%', '22%', '6%'];
  chars.forEach(c => {
    const el = $('#hlm-sprite-' + (c === '林小满' ? 'xm' : 'sz'));
    const idx = order.indexOf(c);
    el.style.left = (idx >= 0 && idx < pos.length) ? pos[idx] : pos[pos.length - 1];
    el.style.opacity = idx >= 0 ? '1' : '0';   /* CSS默认opacity:0,防加载闪烁,显示时显式置1 */
    el.style.zIndex = idx >= 0 ? String(10 - idx) : '';

    const idx = show ? order.length : -1;
    npcEl.style.left = (idx >= 0 && idx < pos.length) ? pos[idx] : pos[pos.length - 1];
    npcEl.style.opacity = (show && idx < pos.length) ? '1' : '0';   /* CSS默认opacity:0,显示时必须显式置1 */
    npcEl.style.zIndex = show ? String(10 - idx) : '';
  }
}
/* ---------- 中途<scene>标签:解析路径并即时切换背景/天气/昼夜 ---------- */
function applySceneRaw(raw){
  const segs = String(raw || '').split('/').map(s => s.trim()).filter(Boolean);
  const isW = s => /^(晴|阴|雨)天?$/.test(s);
  const isD = s => /^(昼|夜|白昼|白天|夜晚|凌晨|清晨|早晨|早上|上午|中午|午后|下午|傍晚|黄昏|深夜)$/.test(s);
  for (let i = 0; i < 2 && segs.length; i++){
    const s = segs[segs.length - 1];
    if (!world.天气 || isW(s)){ if (isW(s)) world.天气 = s.replace(/天$/, ''); segs.pop(); }
    else if (!world.昼夜 || isD(s)){ if (isD(s)) world.昼夜 = s; segs.pop(); }
    else break;
  }
  if (segs.length) world.路径 = segs;
  applyWorld(null, true);
}

/* ---------- 世界状态(日期/时间/天气/地点):正文标签优先,旧存档变量兑底 ---------- */
function applyWorld(v, force){
  const d = world.日期 || (v && v.日期) || '—';
  const t = world.时间 || (v && v.时间) || '—';
  const w = world.天气 || (v && v.天气) || '晴';
  const loc = world.路径[world.路径.length - 1] || (v && v.地点) || '—';
  $('#hlm-date').textContent = d;
  $('#hlm-time').textContent = t;
  $('#hlm-weather').textContent = w;
  $('#hlm-loc').textContent = world.路径.join(' · ');
  const wasW = app.dataset.weather, wasNight = nightOn;
  if (world.昼夜) nightOn = /(夜|晚)/.test(world.昼夜);
  else { const mh = String(t).match(/(\d{1,2})\s*[时点]/); nightOn = mh ? (+mh[1] >= 18 || +mh[1] < 6) : false; }
  app.dataset.weather = w;
  if (force || wasW !== w || wasNight !== nightOn){ buildFx(w); setBg(world.路径.join('/')); }
}

const DEF = {

function pulse(el){ el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }

function fetchStat(cb){

        }).catch(() => { if (++tries < 12) setTimeout(tick, 600); });
      } else if (++tries < 4) setTimeout(tick, 800);
    } catch(e){}
  })();
}

/* ---------- 消息内 <UpdateVariable> JSONPatch:仅用于顶栏即时预显示,变量权威数据仍由mvu写入和刷新 ---------- */
let uiStat = null;
function applyVarPatch(text){
  try {
    const m = (text || '').match(/<UpdateVariable>[\s\S]*?<\/UpdateVariable>/);
    if (!m) return;
    const jp = m[0].match(/<JSONPatch>([\s\S]*?)<\/JSONPatch>/);
    if (!jp) return;
    const ops = JSON.parse(jp[1].trim());
    if (!uiStat) uiStat = JSON.parse(JSON.stringify(DEF));
    for (const op of ops){
      if (op.op === 'remove' || !op.path) continue;
      const segs = op.path.split('/').filter(Boolean);
      if (!segs.length) continue;
      let node = uiStat;
      for (let i = 0; i < segs.length - 1; i++){
        if (typeof node[segs[i]] !== 'object' || node[segs[i]] === null) node[segs[i]] = {};
        node = node[segs[i]];
      }
      node[segs[segs.length - 1]] = op.value;
    }
    applyStat(uiStat);
  } catch(e) { console.warn('[幻想肥皂泡] 变量解析失败', e); }
}

/* ---------- 逐行推进(真·galgame):文本框只显示当前一行,已读行替换不堆叠;
   名字/旁白在左上角名牌;首次开口立绘登场并弹出,非默认表情换图时弹一次;
   支持:自动播放AUTO / 回退BACK / 隐藏界面HIDE / 对话记录LOG ---------- */
const storyEl = $('#hlm-story'), spkEl = $('#hlm-speaker');
const AUTO_BASE = 1400, AUTO_PER_CHAR = 75;   /* 自动播放节奏:基础延时+每字延时(可调) */
let autoOn = false, autoTimer = null, hideOn = false;

/* NPC 换图:识别到新形象的 NPC 开口时更新第三立绘位 */
function updateNpcSprite(){

  const url = (npcState && npcState.arch && NPC_IMG[npcState.arch]) || '';
  if (!url){ el.style.backgroundImage = ''; return; }

  img.onerror = () => { el.style.backgroundImage = ''; };

/* 纯函数:重放前n行,得到第n行时刻的登场/表情/说话人/NPC状态 → 回退也能精确还原。
   语义:NPC出场后持续在台上,直到 [名字/npc 离场] 标记行才消失(与主角一致,统一由标记管理);
   主角首次开口登场,标记行消失,再开口重新登场 */
function computeState(n){
  const en = { '林小满':false, '宋昭':false }, fc = { '林小满':'普通', '宋昭':'普通' };
  let sp = '', npc = null, npcGone = false;
  const byTag = Object.keys(world.在场 || {}).length > 0;
  if (byTag){ en['林小满'] = !!world.在场['林小满']; en['宋昭'] = !!world.在场['宋昭']; }
  for (let i = 0; i < n; i++){
    const L = lines[i];
    if (L.marker === 'exit'){
      for (const nm of L.names){
        if (nm === '林小满' || nm === '宋昭'){ en[nm] = false; }
        else if (nm === 'npc' || (npc && nm === npc.name)){ npc = null; npcGone = true; }
      }
      continue;
    }
    if (L.name === '林小满' || L.name === '宋昭'){
      sp = L.name;
      if (!byTag && !en[L.name]){ en[L.name] = true; fc[L.name] = L.face || '普通'; }
      else if (L.face && L.face !== fc[L.name]) fc[L.name] = L.face;
    }
    if (L.isNpc && L.npc && !npcGone){ npc = { name:L.name, arch:L.npc }; }
  }
  return { en:en, fc:fc, sp:sp, npc:npc };
}
function applyLine(n, pop){
  shown = n;
  const prevFace = { '林小满':curFace['林小满'], '宋昭':curFace['宋昭'] };
  const wasEntered = { '林小满':entered['林小满'], '宋昭':entered['宋昭'] };
  const prevNpc = npcState;
  const st = computeState(n);
  entered['林小满'] = st.en['林小满']; entered['宋昭'] = st.en['宋昭'];
  curFace['林小满'] = st.fc['林小满']; curFace['宋昭'] = st.fc['宋昭'];
  curSpeaker = st.sp;
  npcState = st.npc;
  ['林小满','宋昭'].forEach(w => { if (entered[w] && curFace[w] !== prevFace[w]) setSprite(w, curFace[w]); });
  if (!prevNpc || !npcState || prevNpc.name !== npcState.name || prevNpc.arch !== npcState.arch) updateNpcSprite();
  ['林小满','宋昭'].forEach(w => { if (entered[w] && curFace[w] !== prevFace[w]) setSprite(w, curFace[w]); });
  const L = lines[n - 1];
  if (L && L.marker === 'scene'){
    /* 中途场景标签:切换背景后自动落到下一行 */
    applySceneRaw(L.sceneRaw);
    if (n < lines.length){ applyLine(n + 1, false); return; }
    storyEl.innerHTML = ''; spkEl.textContent = ''; spkEl.className = 'n';
  } else if (L && L.marker === 'date'){
    if (n < lines.length){ applyLine(n + 1, false); return; }
    storyEl.innerHTML = ''; spkEl.textContent = ''; spkEl.className = 'n';
  } else if (L && L.marker === 'exit'){
    /* 离场标记行:不显示正文,自动落到下一行;没有下一行则清空等待点击 */
    if (n < lines.length){ applyLine(n + 1, false); return; }
    storyEl.innerHTML = ''; spkEl.textContent = ''; spkEl.className = 'n';
  } else {
    storyEl.innerHTML = (L && L.text) ? (L.name
      ? '<p class="hlm-dlg">' + fmt(L.text) + '</p>'
      : '<p>' + fmt(L.text) + '</p>') : '';
    if (L){
      if (L.name){
        spkEl.textContent = L.name;
        spkEl.className = L.name === '林小满' ? 'xm' : L.name === '宋昭' ? 'sz' : 'u';
      } else { spkEl.textContent = '旁白'; spkEl.className = 'n'; }
      if (pop && (L.name === '林小满' || L.name === '宋昭')){
        if (!wasEntered[L.name]) popSprite(L.name);                                            /* 首次登场弹 */
        else if (L.face && L.face !== prevFace[L.name] && L.face !== '普通') popSprite(L.name); /* 换非默认表情弹 */
      }
      if (pop && L.isNpc && (!prevNpc || prevNpc.name !== L.name)) popSprite('npc');            /* NPC换人弹 */
    }
  }
  $('#hlm-next').style.display = n < lines.length ? '' : 'none';
  layoutSprites();
  renderLog();
}
function advance(pop){
  /* 前进:跳过标记行(离场/date,纯指令);中途<scene>标记行要先切背景再跳过 */
  let n = shown + 1;
  while (n <= lines.length && lines[n - 1] && lines[n - 1].marker){
    if (lines[n - 1].marker === 'scene') applySceneRaw(lines[n - 1].sceneRaw);
    n++;
  }
  if (n > lines.length) return;
  applyLine(n, pop);
  if (autoOn){ if (shown >= lines.length) stopAuto(); else queueAuto(); }   /* 手动推进也重置自动计时 */
}
function back(){
  /* 回退目标:从当前行往前找最近的非标记行(标记行是纯指令不占一格,跳过它);
     回退穿过中途<scene>标签时恢复上一场景的背景 */
  let n = shown - 1;
  while (n > 1 && lines[n - 1] && lines[n - 1].marker){
    if (lines[n - 1].marker === 'scene'){
      /* 往前找上一个场景标签或块首的scene,恢复它 */
      let k = n - 2;
      while (k >= 1 && !(lines[k - 1] && lines[k - 1].marker === 'scene')) k--;
      if (k >= 1) applySceneRaw(lines[k - 1].sceneRaw);
    }
    n--;
  }
  if (n >= 1 && n < shown){ stopAuto(); applyLine(n, false); }
}
/* 自动播放:按行长动态延时,读完最后一行自动停 */
function stopAuto(){
  autoOn = false; clearTimeout(autoTimer);
  $('#hlm-btn-auto').classList.remove('on');

function startAuto(){

  $('#hlm-btn-auto').querySelector('.hlm-qico').textContent = '❚❚';
  queueAuto();
}
function queueAuto(){
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => { if (autoOn) advance(true); },
    AUTO_BASE + Math.min(4600, ((lines[shown - 1] || {}).text || '').length * AUTO_PER_CHAR));
}
/* 隐藏界面:只剩背景与立绘,点一下恢复 */
function setHide(v){ hideOn = v; app.classList.toggle('hideui', v); }
/* 对话记录:只收录已读行,当前行高亮 */

    return '<div class="hlm-log-item"><span class="l-name ' + cls + '">' + esc(L.name || '旁白') + '</span><span class="l-text">' + fmt(L.text) + '</span></div>';
  }).join('') || '<div class="hlm-empty">还没有内容</div>';
}
function toggleLog(){

/* 交互:点击推进(隐藏态先恢复);键盘:空格/回车推进 ←回退 →前进 A自动 H隐藏 L记录 */
app.addEventListener('click', e => {
  if (e.target.closest('.hlm-modal') || e.target.closest('button') || e.target.closest('input')) return;   /* 按钮/输入框自己的事,不推进也不恢复 */
  if (hideOn){ setHide(false); return; }
  advance(true);
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); if (hideOn) setHide(false); else advance(true); }
  else if (e.key === 'ArrowLeft') back();
  else if (e.key === 'ArrowRight') advance(true);
  else if (e.key === 'a' || e.key === 'A') autoOn ? stopAuto() : startAuto();
  else if (e.key === 'h' || e.key === 'H') setHide(!hideOn);
  else if (e.key === 'l' || e.key === 'L') toggleLog();
});
$('#hlm-btn-back').addEventListener('click', back);
$('#hlm-btn-auto').addEventListener('click', () => autoOn ? stopAuto() : startAuto());

/* ---------- 日记：只有消失的那个人格的日记才会显现 ---------- */
function updateTabs(){
  document.querySelectorAll('.hlm-tab').forEach(t => {
    const gone = isGone(t.dataset.who);
    t.classList.toggle('locked', !gone);
    const base = t.dataset.who + '的日记';
    t.textContent = (gone ? '' : '🔒 ') + base;
  });
  if (isGone('宋昭') && !isGone('林小满')) curTab = '宋昭日记';
  else if (isGone('林小满')) curTab = '林小满日记';
  document.querySelectorAll('.hlm-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === curTab));
}
function renderDiary(){
  const list = $('#hlm-diary-list');
  const who = curTab === '林小满日记' ? '林小满' : '宋昭';
  if (!isGone(who)){
    list.innerHTML = '<div class="hlm-diary-lock"><span class="lk">🔒</span>她还在这个世界上。<br>只有当这个人格消失之后，<br>她独自写下的日记才会显现。</div>';
    return;
  }
  const src = (statRef && statRef[curTab]) || {};
  const keys = Object.keys(src).sort();
  list.innerHTML = keys.length ? keys.map((k, i) =>
    '<div class="hlm-diary-item"><div class="d-date">No.' + String(i + 1).padStart(3, '0') + ' · ' + esc(src[k].日期 || k) + '</div><div class="d-body">' + esc(src[k].日记正文 || '') + '</div></div>'
  ).join('') : '<div class="hlm-empty">日记里还没有字迹</div>';
}
document.querySelectorAll('.hlm-tab').forEach(t => t.addEventListener('click', () => {
  curTab = t.dataset.tab;
  document.querySelectorAll('.hlm-tab').forEach(x => x.classList.toggle('active', x === t));
  renderDiary();
}));

/* 状态面板:渲染 <UpdateVariable> 里的变更项 */
function renderVarChanges(){
  const block = $('#hlm-var-block'), list = $('#hlm-var-list');
  if (!block || !list) return;
  try {
    const jp = varPatchText.match(/<JSONPatch>([\s\S]*?)<\/JSONPatch>/);
    if (!jp){ block.style.display = 'none'; return; }
    const ops = JSON.parse(jp[1].trim());
    const items = [];
    for (const op of ops){
      if (op.op === 'remove' || !op.path) continue;
      const segs = op.path.split('/').filter(Boolean);
      const val = op.value;
      if (typeof val === 'object' && val !== null){
        for (const k in val){
          if (typeof val[k] === 'object') continue;
          items.push([segs[0] + ' · ' + k, String(val[k]), segs[0]]);
        }
      } else {
        items.push([segs.join(' / '), String(val), segs[0] || '']);
      }
    }
    if (!items.length){ block.style.display = 'none'; return; }
    block.style.display = '';
    list.innerHTML = items.slice(0, 20).map(([p, v, who]) => {
      const cls = who === '林小满' || /林小满/.test(p) ? 'xm' : who === '宋昭' || /宋昭/.test(p) ? 'sz' : '';
      return '<div class="hlm-var-item"><span class="vp">' + esc(p) + '</span><span class="vv ' + cls + '">' + esc(v) + '</span></div>';
    }).join('');
  } catch(e){ block.style.display = 'none'; }
}

/* ---------- 发送消息:走酒馆助手的斜杠命令;/send 入楼 + /trigger 生成。
   全屏中发送不退出:轮询最新楼层,生成完成后把新回复原地装载进当前全屏界面 ---------- */
const inp = $('#hlm-input');
function watchGeneration(){
  let tries = 0;
  const timer = setInterval(() => {
    tries++;
    try {
      if (typeof getChatMessages !== 'function'){ clearInterval(timer); return; }
      const lastId = (typeof getLastMessageId === 'function') ? getLastMessageId() : '{{lastMessageId}}';
      const msgs = getChatMessages(lastId);
      const t = (msgs && msgs[0] && msgs[0].message) || '';
      const t2 = String(t).replace(/<konatan_planning~>[\s\S]*?(<\/konatan_planning~>|$)/g, '');
      const blocks = t2.match(/<story>[\s\S]*?<\/story>/g);
      const block = blocks && blocks.length ? blocks.map(b => b.replace(/<\/?story>/g, '')).join('\n') : '';
      if (block && block !== watchGeneration.last){
        clearInterval(timer);
        watchGeneration.last = block;
        loadStory(block);
        applyLine(1, true);
        applyWorld(null, true);
      } else if (tries > 120) clearInterval(timer);
    } catch(e){ if (tries > 120) clearInterval(timer); }
  }, 2000);
}
watchGeneration.last = '';
function sendUser(){
  const t = inp.value.trim();
  if (!t || typeof triggerSlash !== 'function'){ if (inp) inp.placeholder = '酒馆助手未连接,无法发送'; return; }
  const clean = t.replace(/[\r\n]+/g, ' ');
  inp.value = '';
  watchGeneration.last = '';
  triggerSlash('/send ' + clean);
  setTimeout(() => { try { triggerSlash('/trigger'); } catch(e){} }, 400);
  if (fsOn) watchGeneration();   // 全屏中:留在全屏,生成完原地刷新
}
$('#hlm-btn-send').addEventListener('click', () => {
  const bar = $('#hlm-inputbar');
  const open = bar.style.display !== 'none';
  bar.style.display = open ? 'none' : 'flex';
  if (!open) inp.focus();
});
$('#hlm-btn-send2').addEventListener('click', sendUser);
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.stopPropagation(); sendUser(); }
  if (e.key === 'Escape') { e.stopPropagation(); $('#hlm-inputbar').style.display = 'none'; }
});

let fsOn = false, savedStyle = null;
$('#hlm-btn-fs').addEventListener('click', toggleFs);
function toggleFs(){
  fsOn = !fsOn;
  app.classList.toggle('fs', fsOn);
  if (fsOn){
    try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); } catch(e){}
    try {
      const f = window.frameElement;
      if (f){
        savedStyle = f.getAttribute('style') || '';
        Object.assign(f.style, { position:'fixed', inset:'0', width:'100vw', height:'100vh', zIndex:99999, background:'#000' });
      }
    } catch(e){}
  } else {
    try { document.fullscreenElement && document.exitFullscreen(); } catch(e){}
    try {
      const f = window.frameElement;
      if (f && savedStyle !== null) f.setAttribute('style', savedStyle);
    } catch(e){}
  }
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && fsOn) toggleFs(); });
